# Continuous integration (derived from Keystone's, R-016): on every pull request and every push to main — install, route
# types, typecheck, lint, unit tests on a real PostgreSQL 16 (Arche runs on PostgreSQL only: each test file creates its own
# database), the migration and the demo seed of a schema shaped like the shared EPC2I server (`npm run db:local`), the
# production build, then the smoke test against `next start`. A second job runs the Coolify kit (deploy/compose.yaml) end to end.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, tests, migration, build, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ARCHE_TEST_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      ARCHE_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      ARCHE_DIST_DIR: .next-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The backup tests run pg_dump / pg_restore against the PostgreSQL 16 service: use the version-16 client, as the
      # production image does (Dockerfile). A newer client of the runner image writes settings a 16 server refuses
      # (SET transaction_timeout, PostgreSQL 17).
      - name: PostgreSQL 16 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"

      - name: Route types (LayoutProps / PageProps)
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (PostgreSQL)
        run: npm test

      - name: Database (schema arche, role arche_app), migration and demo seed
        run: |
          npm run db:local
          npm run db:migrate
        env:
          DATABASE_URL: postgres://arche_app:arche-dev@127.0.0.1:5432/epc2i
          ARCHE_SEED: demo

      - name: Build
        run: npm run build

      - name: Smoke test (production server)
        run: |
          npx next start --port 3410 > next-start.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3410/api/health > /dev/null && break; sleep 1; done
          npm run test:smoke
        env:
          DATABASE_URL: postgres://arche_app:arche-dev@127.0.0.1:5432/epc2i
          ARCHE_CLOCK: '2026-10-22'
          ARCHE_SMOKE_URL: http://127.0.0.1:3410

      - name: Server log
        if: failure()
        run: cat next-start.log || true

  compose:
    # The Coolify kit end to end (deploy/compose.yaml, without Coolify's own key exclude_from_hc): the image is built, the
    # compose file's PostgreSQL 16 is created like the shared server, the one-shot migration seeds the demo data set, the web
    # server becomes healthy, the smoke test runs inside it, a second deployment's migration is a no-op, and the worker
    # writes its first backup and synchronises the Keystone mirror.
    name: Coolify kit (docker compose, end to end)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      POSTGRES_PASSWORD: ci-postgres
      ARCHE_APP_PASSWORD: ci-arche
      ARCHE_SEED: demo
      ARCHE_CLOCK: '2026-10-22'
      COMPOSE: docker compose -p arche -f deploy/compose.ci.yaml
    steps:
      - uses: actions/checkout@v4
      - name: Compose file without Coolify's own keys
        run: sed '/exclude_from_hc/d' deploy/compose.yaml > deploy/compose.ci.yaml
      - name: Build the image, migrate, start the web server
        run: $COMPOSE up -d --build --wait --wait-timeout 300 app
      - name: The migration succeeded
        run: test "$($COMPOSE ps -a --format '{{.ExitCode}}' migrate)" = "0"
      - name: Smoke test inside the web server
        run: $COMPOSE exec -T -e ARCHE_SMOKE_URL=http://127.0.0.1:3400 app npm run test:smoke
      - name: A redeployment's migration changes nothing
        run: $COMPOSE run --rm migrate
      - name: The worker backs up the schema and synchronises Keystone
        run: |
          $COMPOSE up -d worker
          for i in $(seq 1 60); do $COMPOSE exec -T worker sh -c 'ls /backups/*.dump' > /dev/null 2>&1 && break; sleep 2; done
          $COMPOSE exec -T worker sh -c 'ls -l /backups/*.dump'
          for i in $(seq 1 30); do $COMPOSE logs worker | grep -q 'Job keystone-sync done' && break; sleep 2; done
          $COMPOSE logs worker | grep 'Job keystone-sync done'
      - name: Logs
        if: failure()
        run: $COMPOSE logs --no-color
      - name: Stop
        if: always()
        run: $COMPOSE down -v
